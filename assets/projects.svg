    .font-mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    
    @keyframes pulseCardBorder {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .pulse-border { animation: pulseCardBorder 4s ease-in-out infinite; }
  </style>

