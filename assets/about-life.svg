<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#0c1428" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d162d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#080e1c" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f" />
      <stop offset="100%" stop-color="#ff758c" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.4" />
      <circle cx="30" cy="30" r="0.8" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace; }
    
    @keyframes pulseCard {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.7; }
    }
    .pulse-border { animation: pulseCard 4s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="920" height="520" rx="16" fill="url(#bgGrad)" />
  <rect width="920" height="520" rx="16" fill="url(#gridPattern)" />
  <rect x="1" y="1" width="918" height="518" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Ambient Flares -->
  <circle cx="200" cy="180" r="180" fill="#247bff" opacity="0.08" filter="url(#glowEffect)" />
  <circle cx="700" cy="240" r="200" fill="#ff354f" opacity="0.07" filter="url(#glowEffect)" />

  <!-- ================= LEFT COLUMN: 01. ABOUT ME ================= -->
  <g transform="translate(32, 28)">
    <!-- Section Header Tag -->
    <text x="0" y="12" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">01 // ABOUT ME</text>
    
    <!-- Main Card -->
    <rect x="0" y="24" width="410" height="310" rx="12" fill="url(#cardGrad)" stroke="#247bff" stroke-width="1" stroke-opacity="0.35" class="pulse-border" />
    
    <!-- Card Content -->
    <g transform="translate(24, 52)">
      <!-- Card Title -->
      <text x="0" y="0" fill="#ffffff" class="font-main" font-size="22" font-weight="800">More Than Just Code</text>
      
      <!-- Subtitle Badge -->
      <g transform="translate(0, 12)">
        <rect width="185" height="20" rx="4" fill="#0f172a" stroke="#ff354f" stroke-width="0.8" stroke-opacity="0.6" />
        <text x="8" y="14" fill="#ff758c" class="font-mono" font-size="9.5" font-weight="700">TURNING IDEAS INTO IMPACT</text>
      </g>

      <!-- Bio Paragraph -->
      <text x="0" y="54" fill="#cbd5e1" class="font-main" font-size="12.5" font-weight="400">
        I'm <tspan fill="#ffffff" font-weight="700">Priyanshu Sharma</tspan>, a B.Tech Artificial Intelligence &amp;
      </text>
      <text x="0" y="72" fill="#cbd5e1" class="font-main" font-size="12.5" font-weight="400">
        Data Science student, software developer, and builder.
      </text>
      <text x="0" y="94" fill="#94a3b8" class="font-main" font-size="12.5" font-weight="400">
        I engineer modern web technologies, AI tools, and creative
      </text>
      <text x="0" y="112" fill="#94a3b8" class="font-main" font-size="12.5" font-weight="400">
        digital solutions. My focus is on continuous learning,
      </text>
      <text x="0" y="130" fill="#94a3b8" class="font-main" font-size="12.5" font-weight="400">
        architecting MVPs, and building real-world software.
      </text>

      <!-- 4 Core Pillars Grid -->
      <g transform="translate(0, 160)">
        <!-- Pill 1 -->
        <g transform="translate(0, 0)">
          <rect width="174" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="16" cy="16" r="4" fill="#38bdf8" />
          <text x="28" y="20" fill="#e2e8f0" class="font-main" font-size="11" font-weight="600">Problem Solving</text>
        </g>
        <!-- Pill 2 -->
        <g transform="translate(186, 0)">
          <rect width="174" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="16" cy="16" r="4" fill="#ff354f" />
          <text x="28" y="20" fill="#e2e8f0" class="font-main" font-size="11" font-weight="600">Creative Design</text>
        </g>
        <!-- Pill 3 -->
        <g transform="translate(0, 42)">
          <rect width="174" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="16" cy="16" r="4" fill="#10b981" />
          <text x="28" y="20" fill="#e2e8f0" class="font-main" font-size="11" font-weight="600">Product Building</text>
        </g>
        <!-- Pill 4 -->
        <g transform="translate(186, 42)">
          <rect width="174" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
          <circle cx="16" cy="16" r="4" fill="#a855f7" />
          <text x="28" y="20" fill="#e2e8f0" class="font-main" font-size="11" font-weight="600">Continuous Growth</text>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: 02. WHAT I DO ================= -->
  <g transform="translate(478, 28)">
    <!-- Section Header Tag -->
    <text x="0" y="12" fill="#ff758c" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">02 // WHAT I DO</text>

    <!-- 4 Capability Blocks -->
    <g transform="translate(0, 24)">
      <!-- Block 1: Web Development -->
      <g transform="translate(0, 0)">
        <rect width="410" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <rect x="14" y="14" width="40" height="40" rx="8" fill="#0f172a" stroke="#247bff" stroke-width="1" />
        <path d="M 28 26 L 22 34 L 28 42 M 40 26 L 46 34 L 40 42" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <text x="66" y="32" fill="#ffffff" class="font-main" font-size="14" font-weight="700">Web Development</text>
        <text x="66" y="49" fill="#94a3b8" class="font-main" font-size="11.5">Build modern, scalable &amp; beautiful web applications.</text>
      </g>

      <!-- Block 2: AI & Data Science -->
      <g transform="translate(0, 80)">
        <rect width="410" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <rect x="14" y="14" width="40" height="40" rx="8" fill="#0f172a" stroke="#9333ea" stroke-width="1" />
        <circle cx="34" cy="34" r="8" fill="none" stroke="#a855f7" stroke-width="1.8" />
        <circle cx="34" cy="34" r="3" fill="#a855f7" />
        <line x1="34" y1="20" x2="34" y2="24" stroke="#a855f7" stroke-width="1.5" />
        <line x1="34" y1="44" x2="34" y2="48" stroke="#a855f7" stroke-width="1.5" />
        <text x="66" y="32" fill="#ffffff" class="font-main" font-size="14" font-weight="700">AI &amp; Data Science</text>
        <text x="66" y="49" fill="#94a3b8" class="font-main" font-size="11.5">Develop real-world AI/ML models &amp; data-driven systems.</text>
      </g>

      <!-- Block 3: Product & Startup -->
      <g transform="translate(0, 160)">
        <rect width="410" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <rect x="14" y="14" width="40" height="40" rx="8" fill="#0f172a" stroke="#ff354f" stroke-width="1" />
        <path d="M 28 42 L 34 26 L 40 42 L 34 38 Z" fill="none" stroke="#ff354f" stroke-width="1.8" stroke-linejoin="round" />
        <text x="66" y="32" fill="#ffffff" class="font-main" font-size="14" font-weight="700">Product &amp; Startup</text>
        <text x="66" y="49" fill="#94a3b8" class="font-main" font-size="11.5">Build and grow real products like Root of Web with impact.</text>
      </g>

      <!-- Block 4: Open Source & Tools -->
      <g transform="translate(0, 240)">
        <rect width="410" height="68" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <rect x="14" y="14" width="40" height="40" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" />
        <circle cx="28" cy="34" r="5" fill="none" stroke="#10b981" stroke-width="1.5" />
        <circle cx="40" cy="34" r="5" fill="none" stroke="#10b981" stroke-width="1.5" />
        <text x="66" y="32" fill="#ffffff" class="font-main" font-size="14" font-weight="700">Open Source &amp; Tools</text>
        <text x="66" y="49" fill="#94a3b8" class="font-main" font-size="11.5">Create utilities and contribute to the developer ecosystem.</text>
      </g>
    </g>
  </g>

  <!-- ================= BOTTOM ROW: 03. LIFE OUTSIDE CODE ================= -->
  <g transform="translate(32, 380)">
    <!-- Header & Subtitle -->
    <text x="0" y="12" fill="#38bdf8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1.5">03 // LIFE OUTSIDE CODE</text>
    <text x="180" y="12" fill="#64748b" class="font-main" font-size="11.5">"Meaningful conversations, curiosity, and new horizons keep me inspired."</text>

    <!-- 4 Interest Cards Grid -->
    <g transform="translate(0, 24)">
      <!-- Interest 1: Exploring -->
      <g transform="translate(0, 0)">
        <rect width="202" height="76" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <text x="18" y="34" fill="#ffffff" class="font-main" font-size="13" font-weight="700">🏔️ Exploring Places</text>
        <text x="18" y="52" fill="#94a3b8" class="font-main" font-size="10.5">Discovering new trails &amp; cities</text>
      </g>

      <!-- Interest 2: Photography -->
      <g transform="translate(218, 0)">
        <rect width="202" height="76" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <text x="18" y="34" fill="#ffffff" class="font-main" font-size="13" font-weight="700">📷 Photography</text>
        <text x="18" y="52" fill="#94a3b8" class="font-main" font-size="10.5">Capturing frames &amp; lighting</text>
      </g>

      <!-- Interest 3: Cricket -->
      <g transform="translate(436, 0)">
        <rect width="202" height="76" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <text x="18" y="34" fill="#ffffff" class="font-main" font-size="13" font-weight="700">🏏 Cricket</text>
        <text x="18" y="52" fill="#94a3b8" class="font-main" font-size="10.5">Strategy, teamwork &amp; energy</text>
      </g>

      <!-- Interest 4: Good Food -->
      <g transform="translate(654, 0)">
        <rect width="202" height="76" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="0.8" />
        <text x="18" y="34" fill="#ffffff" class="font-main" font-size="13" font-weight="700">🍜 Great Food</text>
        <text x="18" y="52" fill="#94a3b8" class="font-main" font-size="10.5">Culinary tastes &amp; coffee chats</text>
      </g>
    </g>
  </g>
</svg>